apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aap-cac-configuration
  namespace: openshift-gitops
spec:
  destination:
    namespace: ansible-automation-platform
    server: https://kubernetes.default.svc
  project: default
  source:
    path: k8s
    repoURL: https://github.com/your-org/aap-gitops-cac.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
