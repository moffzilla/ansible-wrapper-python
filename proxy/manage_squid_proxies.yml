---
- name: Combined Squid Proxy Configuration via Templates
  hosts: all
  become: true
  gather_facts: true  # Required to generate dynamic date/time strings for template headers

  vars:
    # Variables mapped from incoming payload / survey
    traffic_type: "internet"   # internet or 'internal'
    dstn_web: "xyz456"
    dstn_ips: "10.100.1.0/24"
    dstn_full: "10.100.1.0/24"
    flow_direct: "Egress"
    flow_path: "External"
    src_ips: "10.200.1.0/24"
    src_full: "10.200.1.0/24"

    # Configuration map that dynamically switches paths and markers based on traffic_type
    proxy_config_map:
      internet:
        squid_marker: '^#ALLOWED INTERNET WEBSITES ACL'
        acl_main_file: '/etc/squid/access-lists/access-lists.conf'
        groups_dir: '/etc/squid/groups/external'
      internal:
        squid_marker: '^#ALLOWED INTERNAL ATT WEBSITES'
        acl_main_file: '/etc/squid/access-lists/access-lists-internal.conf'
        groups_dir: '/etc/squid/groups/internal/intranet'

  tasks:
    # -------------------------------------------------------------------------
    # TASK 1: Modify squid.conf
    # -------------------------------------------------------------------------
    - name: Task 1 - Add new URL ACL under the selected allowed section
      ansible.builtin.lineinfile:
        path: /etc/squid/squid.conf
        line: "acl allow_dst dstdomain .{{ dstn_web }}.com"
        insertafter: "{{ proxy_config_map[traffic_type].squid_marker }}"
        state: present
      notify: Reload Squid Service

    # -------------------------------------------------------------------------
    # TASK 2: Update access-lists
    # -------------------------------------------------------------------------
    - name: Task 2 - Append include line to target access-lists configuration file
      ansible.builtin.lineinfile:
        path: "{{ proxy_config_map[traffic_type].acl_main_file }}"
        line: "include /etc/squid/access-lists/{{ dstn_web }}.conf"
        state: present
      notify: Reload Squid Service

    - name: Task 2 - Generate the destination access-list configuration file from template
      ansible.builtin.template:
        src: templates/access_list.conf.j2
        dest: "/etc/squid/access-lists/{{ dstn_web }}.conf"
        mode: '0644'
        owner: squid
        group: squid
      notify: Reload Squid Service

    # -------------------------------------------------------------------------
    # TASK 3: Generate Domain & IP Files via Templates
    # -------------------------------------------------------------------------
    - name: Task 3 - Generate domain file for new destination
      ansible.builtin.template:
        src: templates/destination.domain.j2
        dest: "{{ proxy_config_map[traffic_type].groups_dir }}/{{ dstn_web }}.domain"
        mode: '0644'
        owner: squid
        group: squid
      notify: Reload Squid Service

    - name: Task 3 - Generate IP file for new destination
      ansible.builtin.template:
        src: templates/destination.ip.j2
        dest: "{{ proxy_config_map[traffic_type].groups_dir }}/{{ dstn_web }}.ip"
        mode: '0644'
        owner: squid
        group: squid
      notify: Reload Squid Service

  # -------------------------------------------------------------------------
  # HANDLERS: Executes squid -k reconfigure ONLY ONCE at the end
  # -------------------------------------------------------------------------
  handlers:
    - name: Reload Squid Service
      ansible.builtin.command: squid -k reconfigure
