---
- name: Combined Squid Proxy Configuration via Templates
  hosts: all
  become: true
  gather_facts: true  # Required to generate dynamic date/time strings for template headers

  vars:
    # Variables mapped from incoming payload / survey
    #traffic_type: "internet"   # internet or 'internal'
    #dstn_web: ".ixyz456.com"
    dstn_web_acl: ".{{ dstn_web }}"
    #dstn_ips: ["10.100.1.0/24", "20.20.20.0/24", "8.8.8.0/24"] 
    #dstn_ips: ["10.100.1.0/24"]
    #dstn_full: "10.100.1.0/24"
    #squid_path: "/etc/squid/squid.conf"
    squid_path: "/tmp/squid.conf"

    # Configuration map that dynamically switches paths and markers based on traffic_type
    proxy_config_map:
      internet:
        squid_marker: '#ALLOWED INTERNET WEBSITES'
        acl_main_file: '/etc/squid/access-lists/access-lists.conf'
        groups_dir: '/etc/squid/groups/external'
        destination: 'allow_dst'
        config_dir: '/etc/squid/access-lists'
      internal:
        squid_marker: '^#ALLOWED INTERNAL ATT WEBSITES'
        acl_main_file: '/etc/squid/access-lists/access-lists-internal.conf'
        groups_dir: '/etc/squid/groups/internal/intranet'
        destination: 'internal_dst'
        config_dir: '/etc/squid/groups/internal/intranet'

  tasks:
    # -------------------------------------------------------------------------
    # TASK 1: Modify squid.conf
    # -------------------------------------------------------------------------
    - name: Append internet domain to ALLOWED INTERNET WEBSITES or ALLOWED INTERNAL ATT WEBSITES
      ansible.builtin.lineinfile:
        path: '{{ squid_path }}'  # Replace with the path to your configuration file
        regexp: '^(acl\s+{{ proxy_config_map[traffic_type].destination | regex_escape }}\s+dstdomain\s+(?!.*\b{{ dstn_web_acl | regex_escape }}\b).*)$'
        line: '\1 {{ dstn_web_acl }}'
        backrefs: yes
      #when: traffic_type == 'internet'
      notify: Reload Squid Service

    # -------------------------------------------------------------------------
    # TASK 2: Create domain conf files via templates
    # -------------------------------------------------------------------------
    - name: Task 2 - Generate the destination access-list configuration file from template
      ansible.builtin.template:
        src: templates/access_list.conf.j2
        dest: "{{ proxy_config_map[traffic_type].config_dir }}/{{ dstn_web }}.conf"
        mode: '0644'
        owner: squid
        group: squid
      notify: Reload Squid Service

    # -------------------------------------------------------------------------
    # TASK 3: Append custom include rule in the access list
    # -------------------------------------------------------------------------
    - name: Append custom include rule before deny.conf in the access-list configuration
      ansible.builtin.lineinfile:
        path: '{{ proxy_config_map[traffic_type].acl_main_file }}'
        insertbefore: "^#; deny\\.conf must be last"
        line: 'include {{ proxy_config_map[traffic_type].config_dir }}/{{ dstn_web }}.conf'
        state: present   
      notify: Reload Squid Service         
      
    # -------------------------------------------------------------------------
    # TASK 4: Generate Domain & IP Files via Templates
    # -------------------------------------------------------------------------
    - name: Task 3 - Generate domain file for new destination
      ansible.builtin.template:
        src: templates/destination.domain.j2
        dest: "{{ proxy_config_map[traffic_type].groups_dir }}/{{ dstn_web }}.domain"
        mode: '0644'
        owner: squid
        group: squid
      notify: Reload Squid Service

    - name: Task 3 - Generate IP file for new destination
      ansible.builtin.template:
        src: templates/destination.ip.j2
        dest: "{{ proxy_config_map[traffic_type].groups_dir }}/{{ dstn_web }}.ip"
        mode: '0644'
        owner: squid
        group: squid
      notify: Reload Squid Service
      
  # -------------------------------------------------------------------------
  # HANDLERS: Executes squid -k reconfigure ONLY ONCE at the end
  # -------------------------------------------------------------------------
  handlers:
    - name: Reload Squid Service
      ansible.builtin.command: squid -k reconfigure
