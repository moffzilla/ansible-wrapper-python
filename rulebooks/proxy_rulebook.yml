---
- name: Listen for GitHub Commit Events
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000  # The port EDA will listen on inside AAP
  rules:
    - name: Trigger Proxy Playbook when JSON file is pushed
      condition: true
#        event.head_commit is defined and 
#        ('proxy_request.json' in event.head_commit.added or 
#         'proxy_request.json' in event.head_commit.modified)
      action:
        run_job_template:
          name: "rh_test_squid_proxy"
          organization: "att_labs"
          job_args:
            extra_vars:
              traffic_type: "{{ event.payload.traffic_type }}"
              dstn_web: "{{ event.payload.dstn_web }}"
              dstn_ips_raw: "{{ event.payload.dstn_ips_raw }}"
#              traffic_type: "internet"
#              dtsn_web: "xyz456.com"
#              dstn_ips_raw: "10.10.10.10"

